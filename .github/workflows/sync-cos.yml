name: Sync website to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate COS secrets
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          for name in TENCENT_SECRET_ID TENCENT_SECRET_KEY COS_BUCKET COS_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              exit 1
            fi
          done
          # COS_BUCKET must be the full bucket name, including its APPID suffix.
          if [[ ! "$COS_BUCKET" =~ ^[a-z0-9][a-z0-9-]*-[0-9]+$ ]]; then
            echo "::error::COS_BUCKET must be a bucket name ending in -APPID, without a URL or path"
            exit 1
          fi
          if [[ ! "$COS_REGION" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::COS_REGION must be a region name, such as ap-guangzhou"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build and sync tools
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The Azure HTTP mirror can stream packages at only ~60 kB/s without
          # hitting an idle timeout. Use Ubuntu's official HTTPS mirror instead.
          sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' -o -name 'apt-mirrors*.txt' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo --preserve-env=DEBIAN_FRONTEND apt-get "${apt_options[@]}" update
          sudo --preserve-env=DEBIAN_FRONTEND apt-get "${apt_options[@]}" install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils poppler-data rclone

      - uses: actions/cache@v4
        with:
          path: .latex-cache
          key: latex-${{ runner.os }}-${{ hashFiles('src/latexMath.ts', 'assets/fonts/fandol/*.otf', 'content/**/*.md') }}
          restore-keys: latex-${{ runner.os }}-

      - name: Configure COS website root for this build
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          # Only update the runner's checkout; keep the Pages URL in the repository.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('site.config.json', 'utf8'));
          config.siteUrl = `https://${process.env.COS_BUCKET}.cos-website.${process.env.COS_REGION}.myqcloud.com/`;
          fs.writeFileSync('site.config.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Install pinned dependencies
        run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run verify

      - name: Incrementally sync dist contents to the bucket root
        timeout-minutes: 15
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_UPLOAD_CONCURRENCY: '8'
          COS_FILE_TIMEOUT_SECONDS: '120'
          COS_MAX_ATTEMPTS: '3'
          RCLONE_CONFIG_COS_TYPE: s3
          RCLONE_CONFIG_COS_PROVIDER: TencentCOS
          RCLONE_CONFIG_COS_ACCESS_KEY_ID: ${{ secrets.TENCENT_SECRET_ID }}
          RCLONE_CONFIG_COS_SECRET_ACCESS_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          RCLONE_CONFIG_COS_REGION: ${{ secrets.COS_REGION }}
          RCLONE_CONFIG_COS_ENDPOINT: https://cos.${{ secrets.COS_REGION }}.myqcloud.com
          RCLONE_CONFIG_COS_NO_CHECK_BUCKET: 'true'
        run: |
          npm run sync:cos
